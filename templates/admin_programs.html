{% extends 'base.html' %}{% block content %}<h1 class="mb-4">Training Program Management</h1><div class="card p-4 mb-4"><h4>Create Program</h4><form method="post" action="{{url_for('program_create')}}"><div class="row g-3"><div class="col-md-6"><input class="form-control" name="title" placeholder="Program title" required></div><div class="col-md-3"><input class="form-control" name="duration" placeholder="Duration" required></div><div class="col-md-3"><select class="form-select" name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="col-12"><textarea class="form-control" name="description" placeholder="Description" required></textarea></div><div class="col-md-6"><select class="form-select" name="trainer_id"><option value="">Assign trainer</option>{% for t in trainers %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></div><div class="col-md-3"><button class="btn btn-primary w-100">Create</button></div></div></form></div><div class="row g-4">{% for p in programs %}<div class="col-lg-6"><div class="card p-4 h-100"><form method="post" action="{{url_for('program_update',pid=p.id)}}"><input class="form-control mb-2" name="title" value="{{p.title}}" required><textarea class="form-control mb-2" name="description" required>{{p.description}}</textarea><div class="row g-2"><div class="col"><input class="form-control" name="duration" value="{{p.duration}}"></div><div class="col"><select class="form-select" name="level"><option selected>{{p.level}}</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div><select class="form-select my-2" name="trainer_id"><option value="">Unassigned</option>{% for t in trainers %}<option value="{{t.id}}" {% if p.trainer_id==t.id %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select><select class="form-select mb-2" name="status"><option {% if p.status=='Active' %}selected{% endif %}>Active</option><option {% if p.status=='Inactive' %}selected{% endif %}>Inactive</option></select><div class="d-flex gap-2"><button class="btn btn-primary">Update</button></form><form method="post" action="{{url_for('program_delete',pid=p.id)}}" onsubmit="return confirm('Delete this program?')"><button class="btn btn-outline-danger">Delete</button></form></div><small class="text-muted mt-2">Assigned trainer: {{p.trainer_name or 'None'}}</small></div></div>{% else %}<p>No programs.</p>{% endfor %}</div>{% endblock %}
