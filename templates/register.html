{% extends 'base.html' %}{% block content %}<section class="auth"><div class="card p-4 shadow-sm"><h2>Register</h2><p class="text-muted">Create an employee or trainer account.</p><form method="post" id="registerForm" novalidate><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Full Name</label><input id="name" class="form-control" name="name" required></div><div class="col-md-6 mb-3"><label class="form-label">Email</label><input id="email" class="form-control" name="email" type="email" required></div><div class="col-md-6 mb-3"><label class="form-label">Password</label><input id="password" class="form-control" name="password" type="password" required></div><div class="col-md-6 mb-3"><label class="form-label">Confirm Password</label><input id="confirm_password" class="form-control" name="confirm_password" type="password" required></div><div class="col-md-6 mb-3"><label class="form-label">Role</label><select id="role" class="form-select" name="role"><option value="employee">Employee</option><option value="trainer">Trainer</option></select></div><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input id="phone" class="form-control" name="phone" maxlength="10"></div><div class="col-md-6 mb-3"><label class="form-label">Department</label><input id="department" class="form-control" name="department"></div><div class="col-md-6 mb-3"><label class="form-label">Designation</label><input id="designation" class="form-control" name="designation"></div><div class="col-md-6 mb-3"><label class="form-label">Skills (Employee)</label><input id="skills" class="form-control" name="skills" placeholder="Python, HTML, CSS"></div><div class="col-md-6 mb-3"><label class="form-label">Expertise (Trainer)</label><input id="expertise" class="form-control" name="expertise" placeholder="Python, Flask, Django"></div><div class="col-md-6 mb-3"><label class="form-label">Experience (Trainer)</label><input class="form-control" name="experience" placeholder="5 Years"></div></div><button class="btn btn-primary w-100">Create Account</button></form></div></section>{% endblock %}
