{% extends 'base.html' %}{% block content %}<div class="result-card text-center"><h1>Assessment Result</h1><p>{{result.training_title}} · {{result.title}}</p><div class="score">{{result.percentage}}%</div><h3>{% if result.passed %}<span class="text-success">PASS</span>{% else %}<span class="text-danger">FAIL</span>{% endif %}</h3><p>Score: {{result.score}} / {{result.total}}</p><a class="btn btn-primary" href="{{url_for('employee_dashboard')}}">Back to Dashboard</a></div>{% endblock %}
